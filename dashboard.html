<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — AI Notes</title>
  <meta name="description" content="View, search, and filter your notes.">
  <link rel="stylesheet" href="css/style.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Navbar -->
    <header class="navbar">
      <div class="container nav-content">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">N</div>
          <span>AI Notes</span>
        </a>
        <div class="nav-actions">
          <span id="user-greeting" style="font-size: 0.88rem; color: var(--text-muted); display: none;" class="font-mono"></span>
          <button id="open-settings-btn" class="btn-icon" aria-label="AI Settings" title="AI Settings & Config">
            ⚙️ AI Config
          </button>
          <button id="theme-toggle-btn" class="btn-icon" aria-label="Toggle Theme" title="Toggle Theme">
            🌓
          </button>
          <button id="logout-btn" class="btn btn-secondary btn-sm">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="container" style="flex: 1; padding-top: 2rem; padding-bottom: 4rem;">
      
      <!-- Top Action Bar -->
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2rem;">
        <div>
          <h1 class="section-title">My Notes</h1>
          <p style="font-size: 0.88rem; color: var(--text-muted);" id="note-count-summary">Loading notes...</p>
        </div>
        <div style="display: flex; gap: 0.75rem;">
          <a href="note.html?action=new" class="btn btn-primary">
            <span>+</span> Create Note
          </a>
        </div>
      </div>

      <!-- Search & Filter Controls -->
      <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
        
        <!-- Search Input Bar -->
        <div style="position: relative;">
          <input type="text" id="search-input" class="input-field" placeholder="Search notes by title, text, tags, or summary..." style="padding-left: 2.5rem;" />
          <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-subtle); pointer-events: none;">🔍</span>
        </div>

        <!-- Tag Filter Pills Container -->
        <div id="tag-filters-container" style="display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;">
          <span style="font-size: 0.8rem; font-family: var(--font-mono); color: var(--text-subtle); text-transform: uppercase;">Filter by Tag:</span>
          <!-- Dynamic tag pills will be rendered here -->
        </div>

      </div>

      <!-- Notes Grid -->
      <div id="notes-grid" class="notes-grid">
        <!-- Dynamic note cards will be rendered here -->
      </div>

      <!-- Empty State Container -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">📝</div>
        <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">No Notes Found</h3>
        <p style="font-size: 0.9rem; max-width: 400px; margin: 0 auto 1.5rem auto;">
          You don't have any notes matching your filter criteria. Create your first note to get started!
        </p>
        <a href="note.html?action=new" class="btn btn-primary">Create a Note</a>
      </div>

    </main>

  </div>

  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>

  <script>
    let currentUser = null;
    let allNotes = [];
    let activeTag = null;
    let searchQuery = '';

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = await Auth.requireAuth();
      if (!currentUser) return;

      // Update UI greeting
      const greeting = document.getElementById('user-greeting');
      greeting.innerText = `@${currentUser.name}`;
      greeting.style.display = 'inline-block';

      // Logout handler
      document.getElementById('logout-btn').addEventListener('click', () => Auth.logout());

      // Search handler
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderNotes();
      });

      // Load Notes
      await loadNotes();
    });

    async function loadNotes() {
      allNotes = await NotesAPI.getNotes(currentUser.uid);
      renderTagFilters();
      renderNotes();
    }

    function renderTagFilters() {
      const container = document.getElementById('tag-filters-container');
      const tagsWithCounts = NotesAPI.getTagsWithCounts(allNotes);

      let html = `
        <button class="tag-pill ${!activeTag ? 'active' : ''}" onclick="selectTag(null)">
          All (${allNotes.length})
        </button>
      `;

      tagsWithCounts.forEach(t => {
        const isActive = activeTag && activeTag.toLowerCase() === t.name.toLowerCase();
        html += `
          <button class="tag-pill ${isActive ? 'active' : ''}" onclick="selectTag('${t.name}')">
            #${t.name} (${t.count})
          </button>
        `;
      });

      container.innerHTML = html;
    }

    window.selectTag = function(tag) {
      activeTag = tag;
      renderTagFilters();
      renderNotes();
    };

    function renderNotes() {
      const grid = document.getElementById('notes-grid');
      const emptyState = document.getElementById('empty-state');
      const summaryText = document.getElementById('note-count-summary');

      const filtered = NotesAPI.filterNotes(allNotes, searchQuery, activeTag);

      summaryText.innerText = `Showing ${filtered.length} of ${allNotes.length} notes`;

      if (filtered.length === 0) {
        grid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      grid.style.display = 'grid';
      emptyState.style.display = 'none';

      grid.innerHTML = filtered.map(note => {
        const snippet = App.escapeHTML(note.content || '').substring(0, 140);
        const tagsHTML = (note.tags || []).map(t => `<span class="tag-pill">#${App.escapeHTML(t)}</span>`).join('');
        const summaryBadge = note.summary ? `<div class="note-summary-badge">✦ ${App.escapeHTML(note.summary)}</div>` : '';
        const formattedDate = App.formatDate(note.updatedAt);

        return `
          <div class="note-card" id="note-card-${note.id}">
            <div>
              <div class="note-header">
                <h2 class="note-title">${App.escapeHTML(note.title || 'Untitled')}</h2>
              </div>
              ${summaryBadge}
              <p class="note-snippet">${snippet}${snippet.length >= 140 ? '...' : ''}</p>
            </div>
            
            <div>
              <div class="note-tags">${tagsHTML}</div>
              <div class="note-footer">
                <span>${formattedDate}</span>
                <div class="note-actions">
                  <a href="note.html?id=${note.id}" class="btn btn-secondary btn-sm" title="Edit Note">Edit</a>
                  <button class="btn btn-secondary btn-sm" onclick="confirmDeleteNote('${note.id}')" title="Delete Note">🗑️</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.confirmDeleteNote = async function(noteId) {
      if (confirm('Are you sure you want to delete this note?')) {
        const res = await NotesAPI.deleteNote(currentUser.uid, noteId);
        if (res.success) {
          App.showToast('Note deleted');
          await loadNotes();
        }
      }
    };
  </script>
</body>
</html>
